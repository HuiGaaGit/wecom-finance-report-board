name: wecom-finance-report-board

services:
  finance-report-board:
    build:
      context: ${FINANCE_SOURCE_DIR:-/data/repos/wecom-finance-report-board}
      dockerfile: Dockerfile
      args:
        APP_UID: 20117
        APP_GID: 20117
    image: aqllm/finance-report-board:1.1.27
    container_name: wecom-finance-report-board
    user: "20117:20117"
    restart: unless-stopped
    env_file:
      - /data/secrets/wecom-finance-report-board/report-board.env
    environment:
      HOST: 0.0.0.0
      PORT: 3180
      DB_FILE: /var/lib/wecom-finance/report-board.db
      UPLOADS_DIR: /var/lib/wecom-finance/uploads
    ports:
      - 127.0.0.1:3180:3180
    volumes:
      - /data/data/wecom-finance-report-board:/var/lib/wecom-finance
    networks:
      - finance-report-board
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=0700,uid=20117,gid=20117
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  finance-report-board:
    name: wecom-finance-report-board
    internal: false
