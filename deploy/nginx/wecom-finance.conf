server {
    listen 80;
    listen [::]:80;
    server_name qiandianxiaoq.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ ^/WW_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/wecom-verification;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qiandianxiaoq.com;

    ssl_certificate /etc/nginx/ssl/qiandianxiaoq.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/qiandianxiaoq.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 28m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^/WW_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/wecom-verification;
        try_files $uri =404;
    }

    location = /report {
        return 302 /report/;
    }

    location /report/ {
        proxy_pass http://127.0.0.1:3180/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
